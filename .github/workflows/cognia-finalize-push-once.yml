name: cognia-primary-rag-finalize-push-once

on:
  push:
    branches: [ feat/cognia-rag-integration ]
    paths:
      - '.github/workflows/cognia-finalize-push-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Cognia finalization patch
        run: python scripts/run_cognia_finalizer_retry.py
      - name: Normalize development template and remove workflow-only patch
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- .github/workflows/quality.yml
          python - <<'PY'
          from pathlib import Path

          env = Path('.env.example')
          text = env.read_text(encoding='utf-8')
          text = text.replace(
              '# Governed Knowledge RAG. Cognia is the canonical/primary provider.\n# local_pgvector is retained only for deterministic development/test fixtures.\nKNOWLEDGE_PROVIDER=cognia\n',
              '# Governed Knowledge RAG. Cognia is mandatory/canonical in Production.\n# This non-secret development template uses local_pgvector so a clean checkout\n# can run without real Cognia credentials; production validation rejects it.\nKNOWLEDGE_PROVIDER=local_pgvector\n',
              1,
          )
          env.write_text(text, encoding='utf-8')

          tests = Path('tests/unit/test_centralized_config.py')
          text = tests.read_text(encoding='utf-8')
          text = text.replace(
              'def test_cognia_is_canonical_template_provider_and_client_application_id_is_distinct():\n    values = _template_values()\n    assert values["KNOWLEDGE_PROVIDER"] == "cognia"\n    assert "COGNIA_CLIENT_APPLICATION_ID" in values\n    assert values["COGNIA_CLIENT_APPLICATION_ID"] == ""\n',
              'def test_cognia_client_application_id_is_distinct_and_dev_template_stays_non_secret():\n    values = _template_values()\n    assert values["KNOWLEDGE_PROVIDER"] == "local_pgvector"\n    assert "COGNIA_CLIENT_APPLICATION_ID" in values\n    assert values["COGNIA_CLIENT_APPLICATION_ID"] == ""\n',
              1,
          )
          tests.write_text(text, encoding='utf-8')

          cfg = Path('docs/CONFIGURATION.md')
          text = cfg.read_text(encoding='utf-8').replace(
              '`KNOWLEDGE_PROVIDER=cognia` is the tracked product default; CI may explicitly switch to `local_pgvector` only for deterministic repository fixtures.',
              '`KNOWLEDGE_PROVIDER=cognia` is mandatory for governed Production. The tracked non-secret development template uses `local_pgvector` only so a clean checkout does not require real Cognia credentials.',
          )
          cfg.write_text(text, encoding='utf-8')

          master = Path('MASTER.md')
          text = master.read_text(encoding='utf-8')
          marker = '## ضمیمه D - قرارداد Cognia، pgvector و Mem0\n'
          if marker in text:
              prefix = text[:text.index(marker)]
              appendix = '''## ضمیمه D - قرارداد Cognia، pgvector و Mem0\n\n### D.1 Cognia\n\nCognia canonical System of Record برای Governed Knowledge، Revision lifecycle، KB Permission، Scope، Search و Context Generation است. AIOps مصرف‌کننده Cognia است و Permission یا lifecycle آن را locally بازسازی نمی‌کند.\n\n### D.2 pgvector\n\n`pgvector` بخشی از Persistence Architecture Operational Memory است. Embeddingهای Memory در PostgreSQL نگهداری می‌شوند و Similarity برای reuse Incident pattern استفاده می‌شود. local Knowledge pgvector فقط fixture/compatibility غیرProduction است.\n\n### D.3 Mem0\n\nMem0 در صورت استفاده، فقط یک Memory Management Layer/Adapter است. انتخاب یا حذف آن نباید Schema، Domain Contract یا LangGraph State را بشکند.\n\n### D.4 Rule\n\n**Cognia = Governed Knowledge RAG؛ PostgreSQL = Platform System of Record؛ pgvector = Operational Memory Semantic Retrieval؛ Operational Memory = تجربه عملیاتی؛ Live Evidence = حقیقت Incident جاری.**\n'''
              master.write_text(prefix + appendix, encoding='utf-8')
          PY
      - name: Commit non-workflow product changes
        shell: bash
        run: |
          set -euo pipefail
          git add . ':!.github/workflows/**' ':!scripts/finalize_cognia_primary_rag.py' ':!scripts/run_cognia_finalizer_retry.py'
          if git diff --cached --quiet; then
            echo 'No product changes to commit'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: make Cognia the canonical governed RAG'
          git push origin HEAD:feat/cognia-rag-integration
