name: chatbot-acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  chatbot-database-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aiops
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d aiops"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PYTHONPATH: ${{ github.workspace }}
      RUN_DB_CHATBOT_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Build ephemeral chatbot acceptance configuration
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path
          path = Path('.env')
          text = path.read_text()
          replacements = {
              'APP_ENV=development': 'APP_ENV=test',
              'DATABASE_URL=postgresql+asyncpg://user:password@localhost:5432/aiops': 'DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/aiops',
              'ALEMBIC_DATABASE_URL=postgresql+psycopg://user:password@localhost:5432/aiops': 'ALEMBIC_DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/aiops',
              'INTERNAL_API_KEY=': 'INTERNAL_API_KEY=chatbot-ci-key',
              'INTERNAL_API_ROLE=operator': 'INTERNAL_API_ROLE=sre',
              'PGVECTOR_VALIDATE_ON_STARTUP=True': 'PGVECTOR_VALIDATE_ON_STARTUP=False',
              'DATABASE_VALIDATE_MIGRATIONS_ON_STARTUP=True': 'DATABASE_VALIDATE_MIGRATIONS_ON_STARTUP=False',
          }
          for old, new in replacements.items():
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip check
      - name: Upgrade clean database to migration head
        run: python -m alembic -c database/migrations/alembic.ini upgrade head
      - name: Run chatbot durable governance and LLM/tool orchestration acceptance
        run: >-
          python -m pytest -q
          tests/integration/test_chatbot_db_acceptance.py
          tests/integration/test_chatbot_llm_acceptance.py
          tests/integration/test_chatbot_tool_acceptance.py
          tests/integration/test_chatbot_write_acceptance.py
