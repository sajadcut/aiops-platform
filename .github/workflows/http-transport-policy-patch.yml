name: http-transport-policy-patch

on:
  push:
    branches:
      - fix/http-https-insecure-transport-20260914
    paths:
      - .github/workflows/http-transport-policy-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply HTTP/HTTPS transport policy patch
        run: |
          set -euo pipefail
          python scripts/http_transport_policy_patch.py
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/CONFIGURATION.md')
          text = p.read_text(encoding='utf-8')
          old = '| `COGNIA_TIMEOUT_SECONDS`, `COGNIA_TLS_VERIFY` | Cognia transport | No | Timeout must be positive. `COGNIA_TLS_VERIFY` is enforced when Production Cognia uses HTTPS; it has no TLS effect for HTTP transport. |'
          new = '| `COGNIA_TIMEOUT_SECONDS` | Cognia transport | No | Timeout must be positive. Both HTTP and HTTPS are supported; HTTPS server certificates are intentionally not validated. |'
          if old in text:
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          python -m compileall -q apps agents domain integrations knowledge tests
      - name: Audit obsolete HTTPS enforcement
        run: |
          set -euo pipefail
          if git grep -n -E 'MCP_REQUIRE_HTTPS|A2A_REQUIRE_HTTPS|COGNIA_TLS_VERIFY|MCP_CA_CERT_PATH|KUBERNETES_CA_CERT_PATH|AIOPS_TLS_VERIFY|mcp_https_required|a2a_https_required' -- ':!scripts/http_transport_policy_patch.py' ':!.github/workflows/http-transport-policy-patch.yml' ':!tests/unit/test_http_transport_policy.py'; then
            echo 'obsolete HTTPS/certificate-verification policy remains' >&2
            exit 1
          fi
      - name: Commit product changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/http-transport-policy-patch.yml scripts/http_transport_policy_patch.py
          git commit -m "fix: allow HTTP and disable HTTPS certificate verification"
          git push origin HEAD:fix/http-https-insecure-transport-20260914
