name: documentation-index

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/generate_file_index_fa.py'
      - 'scripts/generate_code_symbols_fa.py'
      - 'docs/CODEBASE_GUIDE_FA.md'
      - '.github/workflows/documentation-index.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate complete Persian code-symbol index
        run: |
          python scripts/generate_code_symbols_fa.py
          # Staging before the file-index generator makes git ls-files include this
          # newly generated tracked document in the same atomic documentation commit.
          git add docs/CODE_SYMBOLS_FA.md
      - name: Generate complete Persian file index
        run: python scripts/generate_file_index_fa.py
      - name: Commit generated documentation indexes when changed
        shell: bash
        run: |
          set -euo pipefail
          git add docs/CODE_SYMBOLS_FA.md docs/FILE_INDEX_FA.md
          if git diff --cached --quiet; then
            echo 'Persian codebase indexes already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(codebase): sync Persian file and symbol indexes'
          git push origin HEAD:main
