name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Repository hygiene and configuration safety
        shell: bash
        run: |
          set -euo pipefail
          test -f .env.example
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo 'A populated .env must never be tracked'
            exit 1
          fi
          if git ls-files | grep -E '(^|/)(__pycache__/|.*\.(pyc|pyo|zip)$|\.pytest_cache/|\.DS_Store$)'; then
            echo 'Tracked generated artifact detected'
            exit 1
          fi
          if git grep -n -I -E '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|AKIA[0-9A-Z]{16}|Bearer[[:space:]]+[A-Za-z0-9._~+/=-]{12,})' -- ':!tests/**'; then
            echo 'Potential committed secret detected'
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          sensitive = {
              'LLM_API_KEY', 'EMBEDDING_API_KEY', 'INTERNAL_API_KEY',
              'MCP_BEARER_TOKEN', 'MCP_WRITE_BEARER_TOKEN',
              'ZABBIX_MCP_AUTH_HEADER', 'ELASTICSEARCH_MCP_AUTH_HEADER',
              'PROMETHEUS_MCP_AUTH_HEADER', 'ZABBIX_PASSWORD',
              'ELASTICSEARCH_PASSWORD', 'KUBERNETES_TOKEN',
          }
          values = {}
          for raw in Path('.env.example').read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              values[key] = value.strip()
          leaked = {k: values.get(k) for k in sensitive if values.get(k)}
          assert not leaked, f'.env.example contains non-empty sensitive values: {sorted(leaked)}'
          PY
      - name: Build ephemeral CI runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path
          path = Path('.env')
          text = path.read_text()
          replacements = {
              'APP_ENV=development': 'APP_ENV=test',
              'INTERNAL_API_KEY=': 'INTERNAL_API_KEY=ci-test-key',
              'INTERNAL_API_ROLE=operator': 'INTERNAL_API_ROLE=sre',
              'PGVECTOR_VALIDATE_ON_STARTUP=True': 'PGVECTOR_VALIDATE_ON_STARTUP=False',
              'DATABASE_VALIDATE_MIGRATIONS_ON_STARTUP=True': 'DATABASE_VALIDATE_MIGRATIONS_ON_STARTUP=False',
          }
          for old, new in replacements.items():
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Install dependencies and security tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit
          pip check
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
      - name: High severity static security audit
        run: bandit -q -r apps database domain integrations -x tests -lll
      - name: Validate centralized configuration contract
        run: |
          python - <<'PY'
          from domain.contracts.config import Settings, settings
          from pathlib import Path
          assert settings.APP_ENV == 'test'
          assert settings.INTERNAL_API_KEY == 'ci-test-key'
          assert settings.RATE_LIMIT_STRICT_REQUESTS > 0
          assert settings.ALEMBIC_DATABASE_URL
          assert settings.SIGNAL_CORRELATION_ENABLED is True
          keys = set()
          for line in Path('.env.example').read_text().splitlines():
              if line.strip() and not line.lstrip().startswith('#') and '=' in line:
                  keys.add(line.split('=', 1)[0].strip())
          missing = set(Settings.model_fields) - keys
          assert not missing, f'Configuration drift: {sorted(missing)}'
          PY
      - name: Repository-wide syntax check
        run: python -m compileall -q agents apps database domain integrations knowledge memory scripts tests
      - name: Import and dependency integrity
        run: python scripts/check_python_integrity.py
      - name: Full unit integration scenario and security suite
        run: python -m pytest -q tests

  database-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aiops
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d aiops"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Build ephemeral database CI configuration
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path
          path = Path('.env')
          text = path.read_text()
          replacements = {
              'APP_ENV=development': 'APP_ENV=test',
              'DATABASE_URL=postgresql+asyncpg://user:password@localhost:5432/aiops': 'DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/aiops',
              'ALEMBIC_DATABASE_URL=postgresql+psycopg://user:password@localhost:5432/aiops': 'ALEMBIC_DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/aiops',
              'PGVECTOR_VALIDATE_ON_STARTUP=True': 'PGVECTOR_VALIDATE_ON_STARTUP=False',
          }
          for old, new in replacements.items():
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
      - name: Alembic clean database upgrade
        run: python -m alembic -c database/migrations/alembic.ini upgrade head
      - name: Validate migration head
        run: |
          python - <<'PY'
          import asyncio
          from database import AsyncSessionLocal
          from database.migration_validation import validate_migration_head
          async def main():
              async with AsyncSessionLocal() as db:
                  result = await validate_migration_head(db)
              assert result['valid'], result
          asyncio.run(main())
          PY
      - name: Validate canonical schema pgvector and governance persistence
        run: |
          python - <<'PY'
          import psycopg
          from uuid import uuid4
          from pgvector.psycopg import register_vector
          from domain.contracts.config import settings

          url = settings.ALEMBIC_DATABASE_URL.replace('postgresql+psycopg://', 'postgresql://', 1)
          with psycopg.connect(url) as conn:
              register_vector(conn)
              with conn.cursor() as cur:
                  cur.execute("SELECT extversion FROM pg_extension WHERE extname='vector'")
                  assert cur.fetchone(), "pgvector extension missing"
                  cur.execute("SELECT table_name FROM information_schema.tables WHERE table_schema='public'")
                  tables = {row[0] for row in cur.fetchall()}
                  required = {'incidents','evidences','findings','knowledge_documents','memory_entries','approvals','audit_events','workflow_checkpoints','runbooks'}
                  assert required <= tables, required - tables

                  cur.execute("""
                      SELECT table_name, udt_name FROM information_schema.columns
                      WHERE table_name IN ('knowledge_documents','memory_entries') AND column_name='embedding'
                  """)
                  vector_rows = cur.fetchall()
                  assert len(vector_rows) == 2 and all(row[1] == 'vector' for row in vector_rows), vector_rows

                  incident_id = uuid4()
                  cur.execute(
                      "INSERT INTO incidents (id,source,severity,service,status,summary) VALUES (%s,%s,%s,%s,%s,%s)",
                      (incident_id,'ci','high','payments','OPEN','canonical persistence acceptance'),
                  )
                  cur.execute(
                      "INSERT INTO workflow_checkpoints (incident_id,state,status) VALUES (%s,%s::jsonb,%s)",
                      (incident_id,'{\"current_node\":\"approval\"}','paused'),
                  )
                  approval_id = uuid4()
                  cur.execute(
                      "INSERT INTO approvals (approval_id,incident_id,action,risk_level,approver,status,metadata) VALUES (%s,%s,%s,%s,%s,%s,%s::jsonb)",
                      (approval_id,incident_id,'restart_service','high','ci','approved','{\"target\":\"vm01\",\"tool_name\":\"ssh_vm\",\"binding_complete\":true}'),
                  )
                  cur.execute("UPDATE approvals SET status='consumed' WHERE approval_id=%s AND status='approved' RETURNING status", (approval_id,))
                  assert cur.fetchone()[0] == 'consumed'

                  dimension = settings.EMBEDDING_DIMENSION
                  vector = "[" + ",".join(["0.1"] * dimension) + "]"
                  cur.execute(
                      "INSERT INTO knowledge_documents (id,title,content,source,version,extra_metadata,embedding) VALUES (%s,%s,%s,%s,%s,%s::json,%s::vector)",
                      (uuid4(),'ci','pgvector acceptance','ci','1','{\"namespace\":\"knowledge\",\"source_type\":\"runbook\",\"owner\":\"ci\",\"acl\":[\"internal\"]}',vector),
                  )
                  cur.execute("SELECT embedding <=> %s::vector FROM knowledge_documents ORDER BY embedding <=> %s::vector LIMIT 1", (vector, vector))
                  assert cur.fetchone()[0] == 0.0
              conn.commit()
          PY
      - name: Validate PostgreSQL signal-correlation locking and bounded lookup
        env:
          RUN_DB_CORRELATION_TEST: '1'
        run: python -m pytest -q tests/integration/test_signal_correlation_db.py
      - name: Validate upgrade from an existing older database
        shell: bash
        run: |
          set -euo pipefail
          python -m alembic -c database/migrations/alembic.ini downgrade fix_embedding_001
          python - <<'PY'
          import psycopg
          from uuid import uuid4
          from domain.contracts.config import settings
          url = settings.ALEMBIC_DATABASE_URL.replace('postgresql+psycopg://', 'postgresql://', 1)
          with psycopg.connect(url) as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      "INSERT INTO incidents (id,source,severity,service,status,summary) VALUES (%s,%s,%s,%s,%s,%s)",
                      (uuid4(),'existing-db','medium','legacy-service','OPEN','must survive forward migration'),
                  )
              conn.commit()
          PY
          python -m alembic -c database/migrations/alembic.ini upgrade head
          python - <<'PY'
          import psycopg
          from domain.contracts.config import settings
          url = settings.ALEMBIC_DATABASE_URL.replace('postgresql+psycopg://', 'postgresql://', 1)
          with psycopg.connect(url) as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT count(*) FROM incidents WHERE source='existing-db' AND service='legacy-service'")
                  assert cur.fetchone()[0] == 1, 'existing incident was not preserved'
                  cur.execute("SELECT version_num FROM alembic_version")
                  assert cur.fetchone()[0] == 'f2b3c4d5e6f7'
          PY
      - name: Migration downgrade and clean rebuild
        run: |
          python -m alembic -c database/migrations/alembic.ini downgrade base
          python -m alembic -c database/migrations/alembic.ini upgrade head
