name: quality

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PGVECTOR_VALIDATE_ON_STARTUP: "false"
      INTERNAL_API_KEY: "ci-test-key"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(__pycache__/|.*\.(pyc|pyo|zip)$|(^|/)\.env$)'; then
            echo 'Tracked generated or secret artifact detected'
            exit 1
          fi
      - name: Syntax check
        run: python -m compileall agents apps domain integrations knowledge memory tests
      - name: Unit, integration and scenario tests
        run: pytest -q tests/unit tests/integration tests/scenarios
