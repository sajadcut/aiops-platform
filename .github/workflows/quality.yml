name: quality

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(__pycache__/|.*\.(pyc|pyo|zip)$)'; then
            echo 'Tracked cache/bytecode/archive artifact detected'
            exit 1
          fi
      - name: Syntax check
        run: python -m compileall agents apps domain integrations knowledge memory
      - name: Unit and integration tests
        run: pytest -q tests/unit tests/integration tests/scenarios
