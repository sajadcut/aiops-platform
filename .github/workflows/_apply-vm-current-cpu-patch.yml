name: apply-vm-current-cpu-patch

on:
  push:
    branches:
      - fix/vm-current-cpu-metrics-impl

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vm-current-cpu-metrics-impl
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic VM CPU delta patch
        run: python scripts/_apply_vm_current_cpu_patch.py
      - name: Validate targeted tests and syntax
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          python -m compileall -q integrations/vm tests/unit/test_vm_current_cpu_metrics.py
          python -m pytest -q tests/unit/test_vm_current_cpu_metrics.py tests/unit/test_vm_execution_boundary.py tests/security/test_vm_mcp_security.py
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrations/vm/ssh_connector.py tests/unit/test_vm_current_cpu_metrics.py
          git commit -m 'fix(vm): report interval CPU utilization [vm-cpu-patch]'
          git push origin HEAD:fix/vm-current-cpu-metrics-impl
