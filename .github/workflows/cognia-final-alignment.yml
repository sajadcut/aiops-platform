name: cognia-final-alignment

on:
  push:
    branches:
      - fix/cognia-final-alignment-20260914
    paths:
      - .github/workflows/cognia-final-alignment.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Cognia HTTP and HTTPS transport patch
        run: |
          set -euo pipefail
          python scripts/cognia_final_alignment_patch.py
          git diff --check
          python -m compileall -q apps integrations knowledge domain tests
      - name: Commit product changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domain/contracts/config.py tests/unit/test_centralized_config.py .env.example docs/COGNIA_INTEGRATION.md docs/adr/ADR-018-COGNIA-GOVERNED-RAG.md docs/CONFIGURATION.md docs/PROJECT_STATE.md MASTER.md docs/master/IMPLEMENTATION_STATUS.md docs/PRODUCTION_ACCEPTANCE_MATRIX.md FINAL_ACCEPTANCE_REPORT.md PRODUCTION_ACCEPTANCE.md
          git commit -m "fix: support Cognia HTTP and HTTPS endpoints"
          git push origin HEAD:fix/cognia-final-alignment-20260914
