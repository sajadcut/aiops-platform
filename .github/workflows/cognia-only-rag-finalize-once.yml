name: cognia-only-rag-finalize-once

on:
  push:
    branches: [ fix/cognia-only-rag ]
    paths:
      - '.github/workflows/cognia-only-rag-finalize-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply Cognia-only RAG architecture patch
        run: python scripts/cognia_only_rag_finalize.py
      - name: Syntax-check patched Python
        run: python -m compileall -q agents apps database domain integrations knowledge memory scripts tests
      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git add -A ':!.github/workflows/**'
          if git diff --cached --quiet; then
            echo 'No product changes generated'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: make Cognia the only Knowledge RAG'
          git push origin HEAD:fix/cognia-only-rag
