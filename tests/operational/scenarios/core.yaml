    expected: {incident: TLS/certificate failure, correlation: probe and client errors converge, evidence: [certificate metadata, TLS probe, client errors], agents: [identity, security, network], rca: certificate expiry/chain/config failure, confidence: certificate evidence required, decision: restore certificate chain safely, approval_required: true, remediation_required: true, remediation: controlled certificate/config rollback, verification: TLS validates and clients recover, audit_events: [verification_completed]}
