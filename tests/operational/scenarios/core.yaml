    rollback: {action: observability.zabbix_start, parameters: {}, timeout_seconds: 120}

  - id: IDENTITY-JWKS-FAIL
    title: Break staging OIDC/JWKS dependency
    domain: identity
    destructive: true
    service: ${AIOPS_TEST_SERVICE}
    target: ${AIOPS_TEST_IDENTITY_TARGET}
