    preconditions: [isolated staging network policy or DNS fixture]
    injection: {action: network.dns_fail, parameters: {}, timeout_seconds: 30}
    monitoring: {expected_sources: [prometheus, elasticsearch], promql: 'increase(coredns_dns_responses_total{rcode!="NOERROR"}[2m]) > 0', elastic_query: 'service.name:${AIOPS_TEST_SERVICE} AND (DNS OR "name resolution")'}
