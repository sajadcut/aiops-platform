scenarios:
  - id: VM-SERVICE-DOWN
    title: Stop a systemd service on an allowlisted staging VM
    domain: vm
    destructive: true
    service: ${AIOPS_TEST_SERVICE}
    target: ${AIOPS_TEST_VM_HOST}
    preconditions: [staging VM reachable, service monitored, VM MCP write configured]
    injection: {action: vm.stop_service, parameters: {service: ${AIOPS_TEST_VM_SERVICE}}, timeout_seconds: 30}
    monitoring: {expected_sources: [zabbix, prometheus], zabbix_search: ${AIOPS_TEST_VM_SERVICE}, promql: 'up{job="${AIOPS_TEST_SERVICE}"} == 0'}
    expected: {incident: service unavailable, correlation: duplicate alerts join one incident, evidence: [service state, host telemetry, logs], agents: [vm, infrastructure, application], rca: stopped or failed service, confidence: live evidence required, decision: restart only when policy permits, approval_required: true, remediation_required: true, remediation: restart service through VM MCP, tool: vm_mcp, action: restart_service, verification: service active and health/alerts recovered, audit_events: [approval_granted, approval_consumed, verification_completed]}
    rollback: {action: vm.start_service, parameters: {service: ${AIOPS_TEST_VM_SERVICE}}, timeout_seconds: 60}
    timing: {monitor_settle_seconds: 15, incident_timeout_seconds: 240, terminal_timeout_seconds: 360}

  - id: APP-CRASH
    title: Crash an allowlisted staging application
    domain: application
    destructive: true
    service: ${AIOPS_TEST_SERVICE}
    target: ${AIOPS_TEST_SERVICE}
    preconditions: [application monitored by Prometheus and ELK]
    injection: {action: app.crash, parameters: {}, timeout_seconds: 30}
    monitoring: {expected_sources: [prometheus, elasticsearch], promql: 'up{job="${AIOPS_TEST_SERVICE}"} == 0', elastic_query: 'service.name:${AIOPS_TEST_SERVICE} AND (error OR fatal OR crash)'}
    expected: {incident: application crash, correlation: metric and log evidence converge, evidence: [availability metric, crash log], agents: [application, infrastructure], rca: application process crash, confidence: contradictory evidence lowers confidence, decision: safe recovery action, approval_required: true, remediation_required: true, remediation: controlled restart or rollback, verification: health endpoint and error rate recovered, audit_events: [approval_granted, approval_consumed, verification_completed]}
    rollback: {action: app.start, parameters: {}, timeout_seconds: 60}

  - id: APP-HTTP-5XX
    title: Force HTTP 5xx responses
    domain: application
    destructive: true
    service: ${AIOPS_TEST_SERVICE}
    target: ${AIOPS_TEST_SERVICE}
    preconditions: [fault-capable staging application]
    injection: {action: app.force_5xx, parameters: {percent: 80}, timeout_seconds: 30}
    monitoring: {expected_sources: [prometheus, elasticsearch], promql: 'sum(rate(http_requests_total{service="${AIOPS_TEST_SERVICE}",status=~"5.."}[2m])) > 0', elastic_query: 'service.name:${AIOPS_TEST_SERVICE} AND http.response.status_code:[500 TO 599]'}
    expected: {incident: 5xx spike, correlation: repeated 5xx deduplicated, evidence: [5xx metric, application errors], agents: [application, dependency, change], rca: application or dependency failure, confidence: require metric and log support, decision: remediate root cause not alert symptom, approval_required: true, remediation_required: true, remediation: rollback or restart only if evidence supports it, verification: 5xx rate returns below threshold, audit_events: [verification_completed]}
    rollback: {action: app.clear_fault, parameters: {}, timeout_seconds: 60}

  - id: APP-LATENCY
    title: Inject application latency
    domain: application
    destructive: true
    service: ${AIOPS_TEST_SERVICE}
    target: ${AIOPS_TEST_SERVICE}
    preconditions: [latency metric exported]
    injection: {action: app.add_latency, parameters: {milliseconds: 2000}, timeout_seconds: 30}
    monitoring: {expected_sources: [prometheus], promql: 'histogram_quantile(0.95,sum(rate(http_request_duration_seconds_bucket{service="${AIOPS_TEST_SERVICE}"}[2m])) by (le)) > 1'}
    expected: {incident: latency SLO breach, correlation: latency alerts correlate by service, evidence: [p95 latency, dependency latency], agents: [application, dependency, network], rca: isolate application versus downstream latency, confidence: missing dependency data requests more evidence, decision: targeted remediation, approval_required: true, remediation_required: true, remediation: rollback/restart only when causal evidence exists, verification: p95 returns below threshold, audit_events: [verification_completed]}
    rollback: {action: app.clear_fault, parameters: {}, timeout_seconds: 60}

  - id: HOST-CPU-SATURATION
    title: Saturate CPU on a staging target
    domain: infrastructure
    destructive: true
    service: ${AIOPS_TEST_SERVICE}
    target: ${AIOPS_TEST_VM_HOST}
    preconditions: [host CPU metrics available]
    injection: {action: host.cpu_saturate, parameters: {percent: 95, duration_seconds: 180}, timeout_seconds: 30}
    monitoring: {expected_sources: [prometheus, zabbix], promql: '100 - avg(rate(node_cpu_seconds_total{instance="${AIOPS_TEST_VM_HOST}",mode="idle"}[2m])) * 100 > 90', zabbix_search: CPU}
    expected: {incident: CPU saturation, correlation: host and application symptoms linked, evidence: [CPU, load, processes], agents: [infrastructure, vm, application], rca: identify saturation source, confidence: process evidence required for high confidence, decision: avoid blind restart, approval_required: true, remediation_required: true, remediation: policy-approved service recovery or scaling, verification: CPU and service health recover, audit_events: [verification_completed]}
    rollback: {action: host.clear_cpu_fault, parameters: {}, timeout_seconds: 60}

  - id: HOST-MEMORY-OOM
    title: Create memory pressure or OOM
    domain: infrastructure
    destructive: true
    service: ${AIOPS_TEST_SERVICE}
    target: ${AIOPS_TEST_VM_HOST}
    preconditions: [memory and OOM telemetry available]
    injection: {action: host.memory_pressure, parameters: {percent: 90, duration_seconds: 180}, timeout_seconds: 30}
    monitoring: {expected_sources: [prometheus, elasticsearch], promql: '(1 - node_memory_MemAvailable_bytes{instance="${AIOPS_TEST_VM_HOST}"}/node_memory_MemTotal_bytes{instance="${AIOPS_TEST_VM_HOST}"}) > 0.85', elastic_query: 'OOM OR "out of memory"'}
    expected: {incident: memory pressure or OOM, correlation: OOM logs and memory metric converge, evidence: [memory, swap, OOM logs], agents: [infrastructure, vm, application], rca: memory exhaustion and responsible process, confidence: high only with live evidence, decision: safe bounded recovery, approval_required: true, remediation_required: true, remediation: restart/scale after causal validation, verification: memory pressure and service health recover, audit_events: [verification_completed]}
    rollback: {action: host.clear_memory_fault, parameters: {}, timeout_seconds: 60}

  - id: HOST-DISK-FULL
    title: Fill staging filesystem
    domain: storage
    destructive: true
    service: ${AIOPS_TEST_SERVICE}
    target: ${AIOPS_TEST_VM_HOST}
    preconditions: [dedicated disposable test filesystem]
    injection: {action: host.disk_fill, parameters: {mount: ${AIOPS_TEST_MOUNT}, percent: 95}, timeout_seconds: 60}
    monitoring: {expected_sources: [prometheus, zabbix], promql: '1 - node_filesystem_avail_bytes{instance="${AIOPS_TEST_VM_HOST}",mountpoint="${AIOPS_TEST_MOUNT}"}/node_filesystem_size_bytes{instance="${AIOPS_TEST_VM_HOST}",mountpoint="${AIOPS_TEST_MOUNT}"} > 0.9', zabbix_search: disk}
    expected: {incident: disk capacity exhaustion, correlation: disk and application write errors correlate, evidence: [capacity, filesystem, write errors], agents: [storage, infrastructure, vm], rca: identify full filesystem, confidence: filesystem evidence required, decision: cleanup only allowlisted test artifacts, approval_required: true, remediation_required: true, remediation: bounded cleanup or service recovery, verification: free space restored and service healthy, audit_events: [verification_completed]}
    rollback: {action: host.clear_disk_fill, parameters: {mount: ${AIOPS_TEST_MOUNT}}, timeout_seconds: 60}

  - id: HOST-INODE-FULL
    title: Exhaust inodes on disposable staging filesystem
    domain: storage
    destructive: true
    service: ${AIOPS_TEST_SERVICE}
    target: ${AIOPS_TEST_VM_HOST}
    preconditions: [dedicated disposable filesystem]
    injection: {action: host.inode_fill, parameters: {mount: ${AIOPS_TEST_MOUNT}}, timeout_seconds: 60}
    monitoring: {expected_sources: [prometheus, zabbix], promql: '1 - node_filesystem_files_free{instance="${AIOPS_TEST_VM_HOST}",mountpoint="${AIOPS_TEST_MOUNT}"}/node_filesystem_files{instance="${AIOPS_TEST_VM_HOST}",mountpoint="${AIOPS_TEST_MOUNT}"} > 0.9', zabbix_search: inode}
    expected: {incident: inode exhaustion, correlation: filesystem and write failures correlate, evidence: [inode usage, write errors], agents: [storage, infrastructure, vm], rca: inode exhaustion, confidence: require inode metric, decision: bounded cleanup, approval_required: true, remediation_required: true, remediation: remove only injected test files, verification: inode availability and service recover, audit_events: [verification_completed]}
    rollback: {action: host.clear_inode_fill, parameters: {mount: ${AIOPS_TEST_MOUNT}}, timeout_seconds: 60}

  - id: PG-CONNECTION-EXHAUSTION
    title: Exhaust PostgreSQL connections
    domain: database
    destructive: true
    service: ${AIOPS_TEST_SERVICE}
    target: ${AIOPS_TEST_POSTGRES}
    preconditions: [disposable staging database role and pool]
    injection: {action: postgres.connection_exhaustion, parameters: {connections: 50}, timeout_seconds: 60}
    monitoring: {expected_sources: [prometheus, elasticsearch], promql: 'pg_stat_activity_count{instance="${AIOPS_TEST_POSTGRES}"} > 0', elastic_query: '"too many connections" OR "connection pool"'}
    expected: {incident: database connection exhaustion, correlation: DB and application symptoms converge, evidence: [active connections, max connections, app pool logs], agents: [database, application], rca: connection exhaustion and likely leak or pool pressure, confidence: cross-layer evidence preferred, decision: avoid database restart as first action, approval_required: true, remediation_required: true, remediation: bounded application/pool recovery, verification: connection count and request success recover, audit_events: [verification_completed]}
    rollback: {action: postgres.release_test_connections, parameters: {}, timeout_seconds: 60}

  - id: PG-DEADLOCK
    title: Generate a PostgreSQL deadlock
    domain: database
    destructive: true
    service: ${AIOPS_TEST_SERVICE}
    target: ${AIOPS_TEST_POSTGRES}
    preconditions: [isolated test tables]
    injection: {action: postgres.deadlock, parameters: {}, timeout_seconds: 30}
    monitoring: {expected_sources: [prometheus, elasticsearch], promql: 'increase(pg_stat_database_deadlocks{instance="${AIOPS_TEST_POSTGRES}"}[5m]) > 0', elastic_query: 'deadlock AND postgres'}
    expected: {incident: PostgreSQL deadlock, correlation: DB log and metric deduplicate, evidence: [deadlock log, lock graph, query context], agents: [database, application], rca: conflicting transactions, confidence: lock evidence required, decision: recommend application/query fix before restart, approval_required: false, remediation_required: false, remediation: analysis-only unless safe runbook exists, verification: deadlock event captured and no unsafe write executed, audit_events: [verification_completed]}
    rollback: {action: postgres.cleanup_deadlock_fixture, parameters: {}, timeout_seconds: 60}

  - id: PG-SLOW-QUERY
    title: Trigger slow PostgreSQL query
    domain: database
    destructive: true
    service: ${AIOPS_TEST_SERVICE}
    target: ${AIOPS_TEST_POSTGRES}
    preconditions: [isolated staging query fixture]
    injection: {action: postgres.slow_query, parameters: {seconds: 10}, timeout_seconds: 30}
    monitoring: {expected_sources: [prometheus, elasticsearch], promql: 'pg_stat_activity_max_tx_duration{instance="${AIOPS_TEST_POSTGRES}"} > 5', elastic_query: 'postgres AND (slow OR duration)'}
    expected: {incident: query latency regression, correlation: DB latency and app latency correlate, evidence: [query duration, locks, app latency], agents: [database, application], rca: slow query or lock wait, confidence: query evidence required, decision: analysis first, approval_required: false, remediation_required: false, remediation: no destructive action by default, verification: query completes and service recovers, audit_events: [verification_completed]}
