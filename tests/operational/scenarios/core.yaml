    service: ${AIOPS_TEST_SERVICE}
    target: ${AIOPS_TEST_PROMETHEUS_TARGET}
    preconditions: [Zabbix remains available]
    injection: {action: observability.prometheus_stop, parameters: {}, timeout_seconds: 30}
    monitoring: {expected_sources: [zabbix], zabbix_search: Prometheus}
