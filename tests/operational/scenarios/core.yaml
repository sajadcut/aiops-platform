    rollback: {action: messaging.restore_consumer, parameters: {}, timeout_seconds: 120}

  - id: RECOVERY-BACKUP-FAIL
    title: Fail a disposable staging backup or recovery check
    domain: recovery
    destructive: true
    service: ${AIOPS_TEST_SERVICE}
    target: ${AIOPS_TEST_BACKUP_TARGET}
