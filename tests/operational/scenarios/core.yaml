    target: ${AIOPS_TEST_K8S_WORKLOAD}
    preconditions: [allowlisted namespace and workload]
    injection: {action: kubernetes.crashloop, parameters: {namespace: ${AIOPS_TEST_K8S_NAMESPACE}}, timeout_seconds: 60}
    monitoring: {expected_sources: [prometheus, elasticsearch], promql: 'kube_pod_container_status_waiting_reason{namespace="${AIOPS_TEST_K8S_NAMESPACE}",reason="CrashLoopBackOff"} > 0', elastic_query: 'kubernetes.namespace:${AIOPS_TEST_K8S_NAMESPACE} AND CrashLoopBackOff'}
    expected: {incident: CrashLoopBackOff, correlation: Kubernetes event and metrics converge, evidence: [pod events, logs, restart state], agents: [kubernetes, application, infrastructure], rca: crashing workload cause, confidence: event plus logs required, decision: rollback/restart only if causal evidence supports it, approval_required: true, remediation_required: true, remediation: controlled rollout recovery through Kubernetes MCP, verification: desired replicas ready and stable, audit_events: [approval_granted, approval_consumed, verification_completed]}
    rollback: {action: kubernetes.restore_workload, parameters: {namespace: ${AIOPS_TEST_K8S_NAMESPACE}}, timeout_seconds: 120}

  - id: K8S-OOMKILLED
    title: Force OOMKilled in staging workload
    domain: kubernetes
    destructive: true
    service: ${AIOPS_TEST_SERVICE}
    target: ${AIOPS_TEST_K8S_WORKLOAD}
    preconditions: [allowlisted namespace and disposable workload]
    injection: {action: kubernetes.oom, parameters: {namespace: ${AIOPS_TEST_K8S_NAMESPACE}}, timeout_seconds: 60}
    monitoring: {expected_sources: [prometheus, elasticsearch], promql: 'kube_pod_container_status_last_terminated_reason{namespace="${AIOPS_TEST_K8S_NAMESPACE}",reason="OOMKilled"} > 0', elastic_query: 'kubernetes.namespace:${AIOPS_TEST_K8S_NAMESPACE} AND OOMKilled'}
    expected: {incident: OOMKilled, correlation: memory metric and Kubernetes event correlate, evidence: [memory working set, limits, OOM event], agents: [kubernetes, infrastructure, application], rca: memory limit or leak, confidence: memory and event evidence required, decision: no blind pod restart, approval_required: true, remediation_required: true, remediation: safe rollback or resource correction through Kubernetes MCP, verification: stable pods and memory below threshold, audit_events: [verification_completed]}
    rollback: {action: kubernetes.restore_workload, parameters: {namespace: ${AIOPS_TEST_K8S_NAMESPACE}}, timeout_seconds: 120}

