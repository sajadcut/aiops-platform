    monitoring: {expected_sources: [prometheus], promql: 'kube_deployment_status_replicas_available{namespace="${AIOPS_TEST_K8S_NAMESPACE}"} < kube_deployment_spec_replicas{namespace="${AIOPS_TEST_K8S_NAMESPACE}"}'}
    expected: {incident: readiness degradation, correlation: service and pod readiness alerts merge, evidence: [probe status, endpoints, events], agents: [kubernetes, application], rca: readiness dependency or config failure, confidence: distinguish liveness from readiness, decision: rollback/config recovery, approval_required: true, remediation_required: true, remediation: restore readiness configuration, verification: all replicas ready and endpoint serves traffic, audit_events: [verification_completed]}
    rollback: {action: kubernetes.restore_workload, parameters: {namespace: ${AIOPS_TEST_K8S_NAMESPACE}}, timeout_seconds: 120}

