<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AIOps Incident Operations</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{margin:0;padding:24px;background:#0f172a;color:#e2e8f0}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:16px;flex-wrap:wrap}
    .subtitle{color:#94a3b8;font-size:14px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
    .card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:18px}
    .label{color:#94a3b8;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
    .value{font-size:30px;font-weight:700;margin-top:8px}
    .table-wrap{overflow:auto;margin-top:24px;border:1px solid #334155;border-radius:12px}
    table{width:100%;border-collapse:collapse;background:#1e293b;min-width:760px}
    th,td{padding:12px;text-align:left;border-bottom:1px solid #334155}
    th{color:#94a3b8;font-size:13px;text-transform:uppercase}
    .ok{color:#34d399}.warn{color:#fbbf24}.bad{color:#f87171}
    .status{font-size:13px;padding:6px 10px;border-radius:999px;background:#334155;display:inline-block}
    .error{margin-top:16px;color:#f87171;display:none}
    .refresh{color:#94a3b8;font-size:12px}
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>AIOps Incident Operations</h1>
      <div class="subtitle">Live data from PostgreSQL through FastAPI</div>
    </div>
    <div id="refresh" class="refresh">Loading…</div>
  </div>

  <div class="grid">
    <div class="card"><div class="label">Total Incidents</div><div id="total" class="value">—</div></div>
    <div class="card"><div class="label">Open Incidents</div><div id="open" class="value">—</div></div>
    <div class="card"><div class="label">Pending Approvals</div><div id="pending" class="value">—</div></div>
    <div class="card"><div class="label">Approved Actions</div><div id="approved" class="value">—</div></div>
    <div class="card"><div class="label">Verification Success</div><div id="verification" class="value">—</div></div>
    <div class="card"><div class="label">Automation Success Rate</div><div id="automation" class="value">—</div></div>
  </div>

  <div id="error" class="error"></div>

  <div class="table-wrap">
    <table>
      <thead><tr><th>Incident</th><th>Service</th><th>Status</th><th>Severity</th><th>Summary</th></tr></thead>
      <tbody id="incidents"><tr><td colspan="5">Loading incidents…</td></tr></tbody>
    </table>
  </div>

  <script>
    const API_BASE = window.AIOPS_API_BASE || '/api/v1';

    function esc(value){
      return String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    }

    function setText(id, value){ document.getElementById(id).textContent = value; }

    async function getJson(path){
      const response = await fetch(`${API_BASE}${path}`, {headers:{'Accept':'application/json'}});
      if(!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      return response.json();
    }

    async function loadDashboard(){
      const [summary, incidents] = await Promise.all([
        getJson('/dashboard/summary'),
        getJson('/incidents?limit=20')
      ]);

      setText('total', summary.incidents_total ?? 0);
      setText('open', summary.incidents_open ?? 0);
      setText('pending', summary.approvals_pending ?? 0);
      setText('approved', summary.approvals_approved ?? 0);
      setText('verification', summary.verification_success ?? 0);
      setText('automation', `${((summary.automation_success_rate ?? 0) * 100).toFixed(1)}%`);

      const items = incidents.items || [];
      document.getElementById('incidents').innerHTML = items.length
        ? items.map(item => `<tr>
            <td>${esc(item.id)}</td>
            <td>${esc(item.service)}</td>
            <td><span class="status">${esc(item.status)}</span></td>
            <td>${esc(item.severity)}</td>
            <td>${esc(item.summary)}</td>
          </tr>`).join('')
        : '<tr><td colspan="5">No incidents found.</td></tr>';

      document.getElementById('error').style.display = 'none';
      setText('refresh', `Updated ${new Date().toLocaleTimeString()}`);
    }

    async function load(){
      try { await loadDashboard(); }
      catch(error){
        console.error(error);
        const box = document.getElementById('error');
        box.textContent = `Dashboard API error: ${error.message}`;
        box.style.display = 'block';
        setText('refresh', 'API unavailable');
      }
    }

    load();
    setInterval(load, 30000);
  </script>
</body>
</html>
