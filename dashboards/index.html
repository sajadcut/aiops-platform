<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIOps Incident Operations Center</title><style>body{margin:0;background:#08111f;color:#e8eef7;font-family:Inter,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.wrap{padding:24px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}.muted{color:#8da0b8}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #355071;background:#13243c;color:#fff;padding:9px 12px;border-radius:8px}.btn.primary{background:#2563eb;border-color:#2563eb}.btn.fix{background:#a96306;border-color:#c57a17}.btn.success{background:#087f61;border-color:#087f61}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:20px 0}.k{background:#101d31;border:1px solid #263a59;border-radius:12px;padding:15px}.k .l{font-size:10px;color:#8da0b8;text-transform:uppercase}.k .v{font-size:28px;font-weight:800;margin-top:7px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.search,.sel{background:#0e1b2d;border:1px solid #2d4160;color:#fff;padding:10px;border-radius:8px}.search{flex:1;min-width:220px}.status{color:#8da0b8;font-size:12px;padding-top:9px;margin-right:auto}.panel{background:#101d31;border:1px solid #263a59;border-radius:12px;overflow:hidden}.head{padding:14px 16px;border-bottom:1px solid #263a59;display:flex;justify-content:space-between}.content{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:14px}.tbl{overflow:auto}table{width:100%;border-collapse:collapse;min-width:880px}th,td{padding:11px 12px;border-bottom:1px solid #1c2b43;font-size:12px;text-align:right}th{color:#8da0b8;font-size:10px}.pill{padding:4px 8px;border-radius:999px;background:#243753;font-size:10px}.ok{background:#063a30;color:#8ef0c8}.warn{background:#4a2b08;color:#ffd490}.bad{background:#4b161c;color:#ff9fa8}.row{display:flex;gap:5px;flex-wrap:wrap}.detail{padding:15px}.field{background:#0b1728;border:1px solid #213653;padding:9px;border-radius:8px;margin-bottom:8px}.field b{font-size:10px;color:#8da0b8;display:block}.code{white-space:pre-wrap;font:10px ui-monospace,monospace;background:#08111d;border:1px solid #20324d;border-radius:8px;padding:9px;max-height:180px;overflow:auto}.section{margin-top:12px}.drawer{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:10}.drawer.open{display:block}.drawerCard{position:absolute;right:0;top:0;width:min(500px,95vw);height:100%;background:#0d1828;border-left:1px solid #263a59;padding:18px;overflow:auto}.toast{position:fixed;left:20px;bottom:20px;background:#14243b;border:1px solid #395271;padding:10px 14px;border-radius:8px;display:none}.toast.show{display:block}@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.content{grid-template-columns:1fr}}@media(max-width:650px){.kpis{grid-template-columns:repeat(2,1fr)}} </style></head><body><div class="wrap"><div class="top"><div><h1>AIOps Incident Operations</h1><div class="muted">تشخیص، پیشنهاد رفع، Approval، اجرا و Verification</div></div><div class="actions"><button class="btn" onclick="loadAll()">↻ Refresh</button><button class="btn primary" onclick="simulate()">＋ New Incident</button></div></div><section class="kpis"><div class="k"><div class="l">Total</div><div id="total" class="v">—</div></div><div class="k"><div class="l">Open</div><div id="open" class="v">—</div></div><div class="k"><div class="l">Pending Approval</div><div id="pending" class="v">—</div></div><div class="k"><div class="l">Approved</div><div id="approved" class="v">—</div></div><div class="k"><div class="l">Verification Success</div><div id="verify" class="v">—</div></div><div class="k"><div class="l">Automation Rate</div><div id="rate" class="v">—</div></div></section><div class="toolbar"><input id="search" class="search" placeholder="جستجو…" oninput="render()"><select id="statusF" class="sel" onchange="render()"><option value="">همه وضعیت‌ها</option><option>open</option><option>investigating</option><option>resolved</option><option>closed</option></select><select id="severityF" class="sel" onchange="render()"><option value="">همه شدت‌ها</option><option>critical</option><option>high</option><option>medium</option><option>low</option></select><span id="statusline" class="status">Loading…</span></div><section class="content"><div class="panel"><div class="head"><strong>Live Incidents</strong><span id="count" class="pill">0</span></div><div class="tbl"><table><thead><tr><th>Incident</th><th>Service</th><th>Severity</th><th>Status</th><th>Summary</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody></table></div></div><aside class="panel"><div class="head"><strong>Incident Detail</strong><button class="btn" onclick="clearDetail()">Close</button></div><div id="detail" class="detail muted">یک Incident را انتخاب کن.</div></aside></section></div><div id="drawer" class="drawer"><div class="drawerCard"><div class="head"><strong id="drawerTitle">Action</strong><button class="btn" onclick="closeDrawer()">Close</button></div><div id="drawerBody" class="detail"></div></div></div><div id="toast" class="toast"></div><script>const BASE=window.AIOPS_API_BASE||'/api/v1';let data=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,o={}){const r=await fetch(BASE+p,{headers:{'Accept':'application/json','Content-Type':'application/json'},...o});if(!r.ok)throw Error(`${r.status}: ${await r.text()}`);return r.json()}function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2500)}function sev(v){let c=['critical','high'].includes(String(v).toLowerCase())?'bad':String(v).toLowerCase()==='medium'?'warn':'ok';return `<span class="pill ${c}">${esc(v||'unknown')}</span>`}function stat(v){let c=['resolved','closed'].includes(String(v).toLowerCase())?'ok':'warn';return `<span class="pill ${c}">${esc(v||'unknown')}</span>`}async function loadAll(){try{let [s,l]=await Promise.all([api('/dashboard/summary'),api('/dashboard/incidents?limit=100')]);total.textContent=s.incidents_total||0;open.textContent=s.incidents_open||0;pending.textContent=s.approvals_pending||0;approved.textContent=s.approvals_approved||0;verify.textContent=s.verification_success||0;rate.textContent=((s.automation_success_rate||0)*100).toFixed(1)+'%';data=l.items||[];render();statusline.textContent='Updated '+new Date().toLocaleTimeString()}catch(e){statusline.textContent='API error';toast(e.message)}}function render(){let q=search.value.toLowerCase(),s=statusF.value.toLowerCase(),v=severityF.value.toLowerCase(),list=data.filter(x=>(!q||`${x.id} ${x.service} ${x.summary}`.toLowerCase().includes(q))&&(!s||String(x.status||'').toLowerCase()===s)&&(!v||String(x.severity||'').toLowerCase()===v));count.textContent=list.length;rows.innerHTML=list.length?list.map(x=>`<tr><td>${esc(String(x.id).slice(0,12))}</td><td>${esc(x.service)}</td><td>${sev(x.severity)}</td><td>${stat(x.status)}</td><td>${esc(x.summary||'—')}</td><td><div class="row"><button class="btn primary" onclick="inspect('${esc(x.id)}')">Inspect</button><button class="btn" onclick="analyze('${esc(x.id)}')">Analyze</button><button class="btn fix" onclick="remediate('${esc(x.id)}')">🛠 رفع مشکل</button></div></td></tr>`).join(''):'<tr><td colspan="6">No incidents.</td></tr>'}async function inspect(id){try{let [c,e,k,m,p,v,a]=await Promise.all([api(`/incidents/${id}/context`),api(`/incidents/${id}/evidence?limit=50`),api(`/incidents/${id}/knowledge`),api(`/incidents/${id}/memory`),api(`/incidents/${id}/plan`).catch(()=>null),api(`/incidents/${id}/verification`),api(`/incidents/${id}/audit`)]);detail.innerHTML=`<div class="field"><b>Service</b>${esc(c.service)}</div><div class="field"><b>Severity / Status</b>${sev(c.severity)} ${stat(c.status)}</div><div class="row" style="margin-bottom:10px"><button class="btn fix" onclick="remediate('${esc(c.incident_id)}')">🛠 درخواست رفع مشکل</button><button class="btn primary" onclick="analyze('${esc(c.incident_id)}')">Run Analysis</button></div><div class="section"><b>Summary</b><div class="code">${esc(c.summary||'—')}</div></div><div class="section"><b>Evidence</b><div class="code">${esc(JSON.stringify(e.items||[],null,2))}</div></div><div class="section"><b>Knowledge RAG</b><div class="code">${esc(JSON.stringify(k.items||[],null,2))}</div></div><div class="section"><b>Operational Memory</b><div class="code">${esc(JSON.stringify(m.items||[],null,2))}</div></div><div class="section"><b>Plan</b><div class="code">${esc(JSON.stringify(p||{},null,2))}</div></div><div class="section"><b>Verification</b><div class="code">${esc(JSON.stringify(v||{},null,2))}</div></div><div class="section"><b>Audit</b><div class="code">${esc(JSON.stringify(a.items||[],null,2))}</div></div>`}catch(e){detail.innerHTML=esc(e.message)}}async function analyze(id){let x=data.find(i=>String(i.id)===String(id));if(!x)return;try{toast('Running analysis…');await api('/incidents/analyze',{method:'POST',body:JSON.stringify({service:x.service,summary:x.summary,severity:x.severity,source:'dashboard'})});toast('Analysis completed');await loadAll();await inspect(id)}catch(e){toast('Analysis failed: '+e.message)}}function remediate(id){openDrawer('رفع مشکل',`<p>رفع مشکل از مسیر ایمن انجام می‌شود. ابتدا درخواست اصلاح و Approval ساخته می‌شود؛ اجرای Tool تا تأیید Policy/Human مسدود است.</p><button class="btn fix" onclick="createRemediation('${esc(id)}')">ایجاد درخواست رفع</button>`)}async function createRemediation(id){try{let r=await api(`/incidents/${id}/remediate`,{method:'POST',body:JSON.stringify({reason:'Requested from dashboard',risk_level:'medium',approver:'Team-Lead'})});drawerBody.innerHTML=`<div class="field"><b>Approval ID</b>${esc(r.approval_id)}</div><div class="field"><b>Action</b>${esc(r.action)}</div><div class="field"><b>Status</b>${esc(r.status)}</div><div class="code">${esc(r.message)}</div>`;toast('درخواست رفع ثبت شد');loadAll()}catch(e){toast('Remediation failed: '+e.message)}}async function simulate(){let service=prompt('Service','payments-api'),summary=prompt('Incident summary','HTTP 5xx spike after deployment');if(!service||!summary)return;try{await api('/incidents/simulate',{method:'POST',body:JSON.stringify({service,summary,severity:'high',source:'dashboard'})});toast('Incident simulated');loadAll()}catch(e){toast(e.message)}}async function openRunbooks(){try{let r=await api('/runbooks');let names=(r.items||[]).map(x=>x.name||x.id).filter(Boolean);if(!names.length)return toast('No runbooks');let n=prompt('Runbook name:\n'+names.join('\n'),names[0]);if(!n)return;let d=await api(`/runbooks/${encodeURIComponent(n)}/dry-run`,{method:'POST'});openDrawer('Runbook Dry-run',`<div class="code">${esc(JSON.stringify(d,null,2))}</div>`)}catch(e){toast(e.message)}}async function showAudit(){try{let e=await api('/audit/events?limit=100');openDrawer('Audit Trail',`<div class="code">${esc(JSON.stringify(e,null,2))}</div>`)}catch(e){toast(e.message)}}function openDrawer(t,h){drawerTitle.textContent=t;drawerBody.innerHTML=h;drawer.classList.add('open')}function closeDrawer(){drawer.classList.remove('open')}function clearDetail(){detail.innerHTML='<div class="muted">یک Incident را انتخاب کن.</div>'}loadAll();setInterval(loadAll,30000)</script></body></html>
