apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aiops-platform-default-deny
spec:
  podSelector:
    matchLabels:
      app: aiops-platform
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aiops-platform-allow-required
spec:
  podSelector:
    matchLabels:
      app: aiops-platform
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              aiops.network/ingress: "allowed"
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              aiops.network/egress: "allowed"
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
