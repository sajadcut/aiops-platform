apiVersion: batch/v1
kind: Job
metadata:
  name: aiops-platform-migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: aiops-platform-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # MUST be the exact immutable image digest promoted for the API rollout.
          image: registry.internal/aiops-platform:2.2
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - alembic
            - -c
            - database/migrations/alembic.ini
            - upgrade
            - head
          env:
            - name: APP_ENV
              value: production
            - name: TMPDIR
              value: /tmp
          envFrom:
            - configMapRef:
                name: aiops-platform-config
            - secretRef:
                name: aiops-platform-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
