id: kubernetes-health
name: kubernetes-health
owner: sre
version: "1.1"
timeout: 90
preconditions:
  - unhealthy_workload: true
steps:
  - action: inspect_pod_status
  - action: inspect_events
  - action: inspect_health_probes
rollback:
  - action: none
risk: low
verification:
  window_seconds: 180
  checks:
    - state: kubernetes_evidence_collected
      direction: equals
      expected: true
