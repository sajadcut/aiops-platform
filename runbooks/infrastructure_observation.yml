id: infrastructure-observation
name: infrastructure-observation
owner: sre
version: "1.1"
timeout: 60
preconditions:
  - resource_pressure: true
steps:
  - action: inspect_cpu
  - action: inspect_memory
  - action: inspect_disk
rollback:
  - action: none
risk: low
verification:
  window_seconds: 120
  checks:
    - state: evidence_collected
      direction: equals
      expected: true
